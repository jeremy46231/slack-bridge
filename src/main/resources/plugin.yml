name: ${name}
version: ${version}
api-version: '26.3'
main: app.jer.slackbridge.SlackBridgePlugin
description: Two-way Slack chat bridge and Slack account linking (forked from HCCore)
commands:
  slack:
    description: Manage your Slack account link
    usage: /<command> <info | link <slackId> | unlink | lookup <player>>
    permission: slackbridge.command.slack
permissions:
  slackbridge.command.slack:
    description: Use /slack info, link, unlink and lookup
    default: true
