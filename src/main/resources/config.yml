settings:
  slack-link:
    # Whether the Slack integration is enabled
    enabled: false
    # Who may join the server:
    #   none    - anyone the server otherwise allows
    #   linked  - players who have linked an active Slack account in the workspace
    #   channel - linked players whose Slack account is also a member of channel-id
    # Server operators always bypass this, and Minecraft's whitelist still applies on top of it.
    join-requirement: "none"
    # Time in seconds a player's link address works
    link-code-expiration: 600
    # The Slack bot token (xoxb-...). Leave empty to read the SLACK_BOT_TOKEN environment variable.
    bot-token: ""
    # The Slack app-level token for Socket Mode (xapp-...). Leave empty to read the SLACK_APP_TOKEN
    # environment variable.
    app-token: ""
    # The Slack channel ID to send Minecraft messages to and from. Leave empty to read the
    # SLACK_CHANNEL_ID environment variable.
    channel-id: ""
    # The Slack slash command, without the slash. Required. Must match the command in this server's
    # Slack app and be unique in the workspace. Leave empty to read the SLACK_COMMAND environment
    # variable.
    base-command: ""
    # What in-game messages call the Slack workspace, e.g. "the Hack Club Slack"
    slack-name: "Slack"
    # Web linking, the only way players link: they open a short address like
    # mc.example.com/slack/482913, sign in to Slack, and can let their chat post as real messages
    # from their Slack account. Needs all three of these (or the SLACK_PUBLIC_URL, SLACK_CLIENT_ID
    # and SLACK_CLIENT_SECRET environment variables); without them, nobody can link.
    # The HTTPS address that reaches this server's web-port, without a trailing slash; its /slack
    # path must be routed to web-port. Slack redirects players back to <public-url>/slack/callback.
    public-url: ""
    # The Slack app's Client ID and Client Secret (Basic Information > App Credentials)
    client-id: ""
    client-secret: ""
    # Port the built-in web linking server listens on
    web-port: 8101
    # Any long random string, used to encrypt the Slack tokens of players who let their chat post as
    # them (stored in links.yml). Leave empty to read SLACK_TOKEN_KEY; if neither is set, players
    # can only link, not post as themselves. Changing it stops everyone posting as themselves until
    # they link again.
    token-key: ""
    # Avatar for chat from players without a linked Slack account (linked players post with their
    # Slack profile picture). {uuid} and {name} are replaced.
    avatar-url: "https://mc-heads.net/avatar/{uuid}/128"
  # Which game events are posted to Slack
  events:
    chat: true
    join-leave: true
    deaths: true
    advancements: true
    server-start-stop: true
